[project]
name = "spikecast"
version = "0.0.0"
description = "A fly on a road, with a simulated brain, and Jev choosing its actions."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "msgpack>=1.2.3",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6",
    "scipy>=1.14",
    "torch>=2.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
spikecast = "spikecast.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
# Validation only: runs the published reference model to produce M0 ground truth.
# The app never imports it. Install with `uv sync --group reference`.
reference = ["brian2>=2.7", "joblib>=1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spikecast"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Experiment scripts print wide tables and hold compact scene literals.
"scripts/*" = ["E501"]

[tool.ruff.lint.isort]
# Explicit, so import sorting does not depend on the directory ruff is run from.
known-first-party = ["spikecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
